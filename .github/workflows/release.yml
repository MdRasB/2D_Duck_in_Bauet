name: Release builds

on:
  push:
    tags: ['v*']   # trigger: git tag v1.2.1 && git push --tags

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  LINUX
  #  Produces two artifacts:
  #    • DuckDash-linux.deb   — Ubuntu/Debian, GStreamer 1.24 bundled
  #    • DuckDash-linux.AppImage — universal Linux, fully self-contained
  # ═══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Install packaging tools + GStreamer 1.24 (the version JavaFX 21 is compatible with)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot dpkg binutils \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      # ── Step 1: jpackage → app-image (portable directory, not yet an installer) ──
      - name: Create app-image
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type         app-image \
            --name         DuckDash \
            --app-version  "$APP_VERSION" \
            --input        target/app \
            --main-jar     "$MAIN_JAR" \
            --main-class   edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest         target \
            --icon         src/main/resources/images/logo/team_logo2.png \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED"

      # ── Step 2: Copy GStreamer 1.24 shared libraries into the app-image ──
      - name: Bundle GStreamer 1.24 into app-image
        shell: bash
        run: |
          GST_DIR="target/DuckDash/lib/gst"
          GST_PLUGINS="${GST_DIR}/plugins"
          mkdir -p "$GST_PLUGINS"

          LIB_BASE="/usr/lib/x86_64-linux-gnu"

          # Core GStreamer libraries required by JavaFX's native media bridge
          for lib in \
            libgstreamer-1.0.so.0 \
            libgstbase-1.0.so.0 \
            libgstapp-1.0.so.0 \
            libgstaudio-1.0.so.0 \
            libgstvideo-1.0.so.0 \
            libgstpbutils-1.0.so.0; do
            [ -f "${LIB_BASE}/${lib}" ] && cp "${LIB_BASE}/${lib}" "$GST_DIR/"
          done

          # All GStreamer plugin .so files (playback, audio codecs, video decoders, etc.)
          [ -d "${LIB_BASE}/gstreamer-1.0" ] && \
            cp "${LIB_BASE}/gstreamer-1.0/"*.so "$GST_PLUGINS/" 2>/dev/null || true

          echo "Core libs : $(ls $GST_DIR/*.so  2>/dev/null | wc -l)"
          echo "Plugins   : $(ls $GST_PLUGINS/*.so 2>/dev/null | wc -l)"

      # ── Step 3: Replace the launcher with a GStreamer wrapper ──
      - name: Patch app launcher for bundled GStreamer
        shell: bash
        run: |
          LAUNCHER="target/DuckDash/bin/DuckDash"
          # Preserve the original jpackage-generated launcher
          mv "$LAUNCHER" "${LAUNCHER}.real"
          chmod +x "${LAUNCHER}.real"
          # Install our wrapper as the primary launcher
          cp src/packaging/linux/launcher-wrapper.sh "$LAUNCHER"
          chmod +x "$LAUNCHER"

      # ── Step 4: Package the patched app-image into a .deb ──
      - name: Create .deb installer
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          jpackage \
            --type         deb \
            --app-image    target/DuckDash \
            --name         DuckDash \
            --app-version  "$APP_VERSION" \
            --dest         target \
            --resource-dir src/packaging/linux \
            --description  "2D side-scrolling runner game — help the Duck reach class on time" \
            --vendor       "Duck Dash Team"

      # ── Step 5: Wrap the same app-image in an AppImage ──
      - name: Download appimagetool
        run: |
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          APPDIR="DuckDash.AppDir"

          # Seed AppDir from the patched app-image
          mkdir -p "$APPDIR"
          cp -r target/DuckDash/bin "$APPDIR/"
          cp -r target/DuckDash/lib "$APPDIR/"

          # AppImage-specific files at AppDir root
          cp  src/packaging/appimage/AppRun        "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp  src/packaging/appimage/DuckDash.desktop "$APPDIR/"
          cp  src/main/resources/images/logo/team_logo2.png "$APPDIR/DuckDash.png"

          # Build the AppImage (APPIMAGE_EXTRACT_AND_RUN bypasses FUSE in CI)
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            "$APPDIR" \
            "target/DuckDash-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-deb
          path: target/*.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-appimage
          path: target/*.AppImage

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS — .exe installer
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods;target/deps;$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Create .exe installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type         exe \
            --name         DuckDash \
            --app-version  "${GITHUB_REF_NAME#v}" \
            --input        target/app \
            --main-jar     "$MAIN_JAR" \
            --main-class   edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest         target \
            --resource-dir src/packaging/windows \
            --icon         src/packaging/windows/DuckDash.ico \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-windows
          path: target/*.exe

  # ═══════════════════════════════════════════════════════════════
  #  macOS ARM64 — .dmg (Apple Silicon, M1/M2/M3)
  # ═══════════════════════════════════════════════════════════════
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Generate .icns icon from project logo
        shell: bash
        run: |
          SOURCE="src/main/resources/images/logo/team_logo2.png"
          mkdir -p DuckDash.iconset src/packaging/macos
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size "$SOURCE" \
              --out "DuckDash.iconset/icon_${size}x${size}.png" 2>/dev/null || true
          done
          iconutil -c icns DuckDash.iconset \
            -o src/packaging/macos/DuckDash.icns 2>/dev/null || true

      - name: Create .dmg installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          ICON_ARG=""
          [ -f src/packaging/macos/DuckDash.icns ] && \
            ICON_ARG="--icon src/packaging/macos/DuckDash.icns"
          jpackage \
            --type          dmg \
            --name          DuckDash \
            --app-version   "${GITHUB_REF_NAME#v}" \
            --input         target/app \
            --main-jar      "$MAIN_JAR" \
            --main-class    edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest          target \
            --resource-dir  src/packaging/macos \
            --mac-package-identifier edu.bauet.java.cse.duckrun \
            --java-options  "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options  "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            $ICON_ARG

      - name: Rename DMG with architecture label
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(ls target/DuckDash-*.dmg 2>/dev/null | head -1)
          [ -n "$DMG" ] && mv "$DMG" "target/DuckDash-${VERSION}-macos-arm64.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-macos-arm64
          path: target/DuckDash-*-macos-arm64.dmg

  # ═══════════════════════════════════════════════════════════════
  #  RELEASE — collect all artifacts into a GitHub Release
  # ═══════════════════════════════════════════════════════════════
  release:
    needs: [build-linux, build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DuckDash-linux-deb/*.deb
            DuckDash-linux-appimage/*.AppImage
            DuckDash-windows/*.exe
            DuckDash-macos-arm64/*.dmg
          generate_release_notes: true