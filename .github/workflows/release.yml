name: Release builds

on:
  push:
    tags: ['v*']   # trigger: git tag v1.2.1 && git push --tags

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  LINUX — .deb installer
  #
  #  Fully independent job. Does its own checkout → build → jlink →
  #  jpackage, from scratch. Shares no step, artifact, or app-image
  #  with build-linux-appimage below — a failure or change on one
  #  side can never affect the other.
  #
  #  No vendored GStreamer/FFmpeg/orc, no dependency-closure walk.
  #  JavaFX 21's media module talks to whatever GStreamer 1.x the
  #  target machine already has installed — this is the standard,
  #  documented way OpenJFX Media works on Linux. The Depends: line
  #  in the control template below tells apt/dpkg exactly which
  #  GStreamer plugin sets DuckDash needs, so `apt install ./*.deb`
  #  (or a plain `dpkg -i` followed by `apt --fix-broken install`)
  #  pulls them in automatically. That is what fixes MP4 playback on
  #  a fresh machine — the correct decoders are declared, not copied.
  # ═══════════════════════════════════════════════════════════════
  build-linux-deb:
    runs-on: ubuntu-24.04   # pinned for reproducible build tooling only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg binutils

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      # jpackage on Ubuntu auto-generates a Depends: line filled with
      # exact SONAME-versioned library packages (libavcodec60, libicu74,
      # …). Those exact names are frequently renamed or version-bumped
      # between Ubuntu releases, so a .deb built this way can fail to
      # install on any release other than the one it was built on.
      # Providing our own control template replaces that with a short,
      # stable list of real Debian/Ubuntu package names that have held
      # the same names across releases for years.
      - name: Write deb control template
        shell: bash
        run: |
          printf '%s\n' \
            'Package: APPLICATION_PACKAGE' \
            'Version: APPLICATION_VERSION' \
            'Section: misc' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: MAINTAINER' \
            'Installed-Size: INSTALL_SIZE' \
            'Depends: gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-pulseaudio | gstreamer1.0-alsa' \
            'Description: APPLICATION_DESCRIPTION' \
            > src/packaging/linux/control

      # Single jpackage call, straight from --input to --type deb.
      # No intermediate app-image is needed — that indirection only
      # existed to give a previous version of this pipeline a place
      # to inject vendored native libraries before packaging.
      - name: Create .deb installer
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type deb \
            --name DuckDash \
            --app-version "$APP_VERSION" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --resource-dir src/packaging/linux \
            --icon src/main/resources/images/logo/team_logo2.png \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            --description "2D side-scrolling runner game — help the Duck reach class on time" \
            --vendor "Duck Dash Team"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-deb
          path: target/*.deb

  # ═══════════════════════════════════════════════════════════════
  #  LINUX — .AppImage
  #
  #  Fully independent job. Does its own checkout → build → jlink →
  #  jpackage app-image → AppImage, from scratch. Shares nothing with
  #  build-linux-deb above.
  #
  #  Runtime: built with the current AppImage/appimagetool (the
  #  official successor to the old AppImageKit tool). It embeds the
  #  modern type2-runtime, which has libfuse compiled statically into
  #  the runtime itself instead of dynamically loading the system's
  #  libfuse.so.2 at launch. That is exactly what was breaking
  #  "./DuckDash-*.AppImage" on current distros — Ubuntu 24.04+,
  #  Fedora 40+ and others stopped installing libfuse2/libfuse2t64 by
  #  default, so the old runtime failed immediately with
  #  "dlopen(): error loading libfuse.so.2" unless the user manually
  #  installed that package or passed --appimage-extract-and-run.
  #  With the statically-linked runtime, `./DuckDash-*.AppImage` runs
  #  standalone with no extra flags and no extra packages.
  #
  #  No vendored GStreamer/FFmpeg here either — same reasoning as the
  #  .deb job above. AppImage has no dependency-declaration mechanism,
  #  so playback depends on the host's own GStreamer plugins (listed
  #  in the README for users on a minimal/headless install).
  # ═══════════════════════════════════════════════════════════════
  build-linux-appimage:
    runs-on: ubuntu-24.04   # pinned for reproducible build tooling only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Create app-image
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type app-image \
            --name DuckDash \
            --app-version "$APP_VERSION" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --icon src/main/resources/images/logo/team_logo2.png \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED"

      # AppRun is committed as-is under src/packaging/appimage/ and is
      # no longer rewritten at build time — there is no per-run logic
      # left to inject, so the checked-in file IS the production file.
      - name: Assemble AppDir
        shell: bash
        run: |
          APPDIR="DuckDash.AppDir"
          mkdir -p "$APPDIR"
          cp -r target/DuckDash/bin "$APPDIR/"
          cp -r target/DuckDash/lib "$APPDIR/"
          cp src/packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp src/packaging/appimage/DuckDash.desktop "$APPDIR/"
          cp src/main/resources/images/logo/team_logo2.png "$APPDIR/DuckDash.png"

      - name: Download appimagetool
        run: |
          wget -q \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            "DuckDash.AppDir" \
            "target/DuckDash-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-appimage
          path: target/*.AppImage

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS — .exe installer
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods;target/deps;$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Create .exe installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type exe \
            --name DuckDash \
            --app-version "${GITHUB_REF_NAME#v}" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --resource-dir src/packaging/windows \
            --icon src/packaging/windows/DuckDash.ico \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            --java-options "-Dprism.vsync=false" \
            --java-options "-Djavafx.animation.fullspeed=true" \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-windows
          path: target/*.exe

  # ═══════════════════════════════════════════════════════════════
  #  macOS ARM64 — .dmg (Apple Silicon M1/M2/M3)
  # ═══════════════════════════════════════════════════════════════
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Generate .icns icon from project logo
        shell: bash
        run: |
          SOURCE="src/main/resources/images/logo/team_logo2.png"
          mkdir -p DuckDash.iconset src/packaging/macos
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size "$SOURCE" \
              --out "DuckDash.iconset/icon_${size}x${size}.png" 2>/dev/null || true
          done
          iconutil -c icns DuckDash.iconset \
            -o src/packaging/macos/DuckDash.icns 2>/dev/null || true

      - name: Create .dmg installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          ICON_ARG=""
          [ -f src/packaging/macos/DuckDash.icns ] && \
            ICON_ARG="--icon src/packaging/macos/DuckDash.icns"
          jpackage \
            --type dmg \
            --name DuckDash \
            --app-version "${GITHUB_REF_NAME#v}" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --resource-dir src/packaging/macos \
            --mac-package-identifier edu.bauet.java.cse.duckrun \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            $ICON_ARG

      - name: Rename DMG with architecture label
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(ls target/DuckDash-*.dmg 2>/dev/null | head -1)
          [ -n "$DMG" ] && mv "$DMG" "target/DuckDash-${VERSION}-macos-arm64.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-macos-arm64
          path: target/DuckDash-*-macos-arm64.dmg

  # ═══════════════════════════════════════════════════════════════
  #  RELEASE — attach all artifacts to the GitHub Release
  # ═══════════════════════════════════════════════════════════════
  release:
    needs: [build-linux-deb, build-linux-appimage, build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DuckDash-linux-deb/*.deb
            DuckDash-linux-appimage/*.AppImage
            DuckDash-windows/*.exe
            DuckDash-macos-arm64/*.dmg
          generate_release_notes: true
