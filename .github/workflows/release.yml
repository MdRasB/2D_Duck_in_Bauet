name: Release builds

on:
  push:
    tags: ['v*']   # trigger: git tag v1.2.1 && git push --tags

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  LINUX
  #  • .deb      — self-contained; works on Ubuntu 22.04/24.04/26.04+
  #  • .AppImage — fully self-contained; works on any x86_64 Linux
  #
  #  Root cause of Ubuntu 26.04 failure:
  #  JavaFX 21 is incompatible with GStreamer 1.28 (ships on 26.04).
  #
  #  Fix:
  #  1. Build on ubuntu-24.04 and bundle GStreamer 1.24 core libs.
  #  2. ALSO bundle FFmpeg 6.x (libavcodec.so.60 etc.) — the
  #     gstreamer1.0-libav plugin hard-links these SONAMEs; Ubuntu 26.04
  #     ships FFmpeg 7.x (libavcodec.so.61) so without bundling the
  #     libav plugin silently fails → "Could not create player!".
  #  3. ALSO bundle liborc-0.4 (GStreamer SIMD library) to avoid minor
  #     version mismatches between Ubuntu releases.
  #  4. Smart launcher wrapper: checks system GStreamer at runtime.
  #     • system GStreamer < 1.28  → use system (Ubuntu 22.04/24.04)
  #     • system GStreamer ≥ 1.28  → prepend bundled libs (Ubuntu 26.04+)
  # ═══════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install packaging tools and GStreamer 1.24
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot dpkg binutils \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      # ── STEP 1: Create jpackage app-image ─────────────────────────────────
      - name: Create app-image
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type app-image \
            --name DuckDash \
            --app-version "$APP_VERSION" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --icon src/main/resources/images/logo/team_logo2.png \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED"

      # ── STEP 2: Bundle GStreamer 1.24 + FFmpeg 6 + orc ────────────────────
      #
      #  WHY FFmpeg 6.x:
      #    gstreamer1.0-libav (the plugin that decodes MP3 and MP4) links
      #    against libavcodec.so.60, libavformat.so.60, libavutil.so.58 etc.
      #    Ubuntu 26.04 ships FFmpeg 7.x whose SONAMEs are .so.61/.so.59/…
      #    The old .so.60 names are completely absent, so the libav plugin
      #    fails to dlopen → no audio/video decoder → MediaPlayer throws
      #    "Could not create player!" even though GStreamer core loads fine.
      #    Bundling the Ubuntu 24.04 FFmpeg 6.x libs fixes this on all distros.
      #
      #  WHY liborc:
      #    GStreamer uses orc for SIMD-accelerated audio/video processing.
      #    Minor orc version bumps between Ubuntu releases occasionally
      #    introduce new symbols that the 24.04-compiled GStreamer expects
      #    but which are absent from older/newer system orc. Bundling avoids
      #    this entirely.
      - name: Bundle GStreamer 1.24 + FFmpeg 6 + orc into app-image
        shell: bash
        run: |
          GST_DIR="target/DuckDash/lib/gst"
          GST_PLUGINS="${GST_DIR}/plugins"
          mkdir -p "$GST_PLUGINS"
          LIB_BASE="/usr/lib/x86_64-linux-gnu"

          # Core GStreamer 1.24 libs
          for lib in \
            libgstreamer-1.0.so.0 \
            libgstbase-1.0.so.0 \
            libgstapp-1.0.so.0 \
            libgstaudio-1.0.so.0 \
            libgstvideo-1.0.so.0 \
            libgstpbutils-1.0.so.0; do
            [ -f "${LIB_BASE}/${lib}" ] && cp "${LIB_BASE}/${lib}" "$GST_DIR/"
          done

          # All GStreamer plugins
          [ -d "${LIB_BASE}/gstreamer-1.0" ] && \
            cp "${LIB_BASE}/gstreamer-1.0/"*.so "$GST_PLUGINS/" 2>/dev/null || true

          # FFmpeg 6.x (Ubuntu 24.04 SONAMEs) — required by gstreamer1.0-libav
          for lib in \
            libavcodec.so.60 \
            libavformat.so.60 \
            libavutil.so.58 \
            libswresample.so.4 \
            libswscale.so.7 \
            libavfilter.so.9; do
            [ -f "${LIB_BASE}/${lib}" ] && cp "${LIB_BASE}/${lib}" "$GST_DIR/"
          done

          # orc — SIMD acceleration lib used internally by GStreamer
          [ -f "${LIB_BASE}/liborc-0.4.so.0" ] && \
            cp "${LIB_BASE}/liborc-0.4.so.0" "$GST_DIR/"

          echo "Core + FFmpeg libs : $(ls "$GST_DIR"/*.so  2>/dev/null | wc -l)"
          echo "Plugins bundled    : $(ls "$GST_PLUGINS"/*.so 2>/dev/null | wc -l)"

      # ── STEP 3: Write smart launcher wrappers and patch the app-image ──────
      #
      #  Uses Python (shell: python3 {0}) to write the wrapper scripts.
      #  This completely avoids the heredoc-in-YAML indentation trap where
      #  a heredoc terminator with leading spaces is never matched, leaving
      #  the file empty or garbage.
      #
      #  Smart logic (shared by .deb wrapper and AppImage AppRun):
      #    • Query gst-inspect-1.0 for the system GStreamer version.
      #    • If version < 1.28 (compatible with JavaFX 21) → do nothing,
      #      let the JVM find system GStreamer normally.
      #    • If version ≥ 1.28, or gst-inspect-1.0 is absent → prepend
      #      bundled lib/gst/ to LD_LIBRARY_PATH so the JVM loads our
      #      GStreamer 1.24 + FFmpeg 6 instead of the system version.
      #
      #  Also copies DuckDash.cfg → DuckDash.bin.cfg so the renamed
      #  binary can locate its jpackage configuration file.
      - name: Patch app launcher with smart GStreamer wrapper
        shell: python3 {0}
        run: |
          import os, stat, shutil

          # Version-check block — identical logic used in both wrappers.
          # All lines are Python list elements to avoid triple-quoted strings
          # whose content would sit at column-0 and break YAML indentation
          # stripping for the surrounding Python code.
          GST_CHECK = '\n'.join([
              '_GST_OK=0',
              'if command -v gst-inspect-1.0 >/dev/null 2>&1; then',
              "  _VER=$(gst-inspect-1.0 --version 2>/dev/null | awk 'NR==1{print $NF}')",
              '  _MAJ=$(echo "$_VER" | cut -d. -f1)',
              '  _MIN=$(echo "$_VER" | cut -d. -f2)',
              '  [ "$_MAJ" -eq 1 ] 2>/dev/null && [ "$_MIN" -lt 28 ] 2>/dev/null && _GST_OK=1',
              'fi',
              'if [ "$_GST_OK" -eq 0 ]; then',
              '  export LD_LIBRARY_PATH="${APPDIR}/lib/gst:${LD_LIBRARY_PATH:-}"',
              '  export GST_PLUGIN_PATH="${APPDIR}/lib/gst/plugins"',
              '  export GST_PLUGIN_SYSTEM_PATH_1_0="${APPDIR}/lib/gst/plugins"',
              '  export GST_REGISTRY_1_0="${XDG_CACHE_HOME:-${HOME}/.cache}/duckdash-gst-registry.bin"',
              'fi',
          ])

          # .deb launcher: must compute APPDIR from its own location
          DEB_WRAPPER = '\n'.join([
              '#!/bin/sh',
              'APPDIR="$(cd "$(dirname "$0")/.." && pwd -P)"',
              GST_CHECK,
              'exec "${APPDIR}/bin/DuckDash.bin" "$@"',
              '',
          ])

          # AppImage AppRun: $APPDIR is injected by the AppImage runtime
          APPRUN = '\n'.join([
              '#!/bin/bash',
              GST_CHECK,
              'exec "${APPDIR}/bin/DuckDash" "$@"',
              '',
          ])

          def write_exec(path, content):
              with open(path, 'w') as fh:
                  fh.write(content)
              s = os.stat(path)
              os.chmod(path, s.st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          launcher = 'target/DuckDash/bin/DuckDash'

          # Rename original jpackage binary → DuckDash.bin
          shutil.copy2(launcher, launcher + '.bin')
          s = os.stat(launcher + '.bin')
          os.chmod(launcher + '.bin', s.st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          # jpackage names the config after the launcher binary.
          # After renaming to DuckDash.bin the binary looks for DuckDash.bin.cfg.
          shutil.copy2(
              'target/DuckDash/lib/app/DuckDash.cfg',
              'target/DuckDash/lib/app/DuckDash.bin.cfg',
          )

          # Write smart wrappers
          write_exec(launcher, DEB_WRAPPER)
          write_exec('src/packaging/appimage/AppRun', APPRUN)

          print('launcher-wrapper  :', launcher)
          print('AppRun            :', 'src/packaging/appimage/AppRun')
          print('DuckDash.bin.cfg  :', 'target/DuckDash/lib/app/DuckDash.bin.cfg')

      # ── STEP 3.5: Write the deb control file template ─────────────────────
      #
      #  jpackage on ubuntu-24.04 auto-generates a Depends: line filled with
      #  Ubuntu 24.04 library names (libavcodec60, libicu74, libvpx9, …).
      #  None of those package names exist on Ubuntu 26.04 (they are renamed
      #  or version-bumped), so dpkg refuses to install with "dependency
      #  problems".  Providing our own control template with NO Depends: line
      #  is safe because:
      #    • The JVM is fully self-contained (bundled by jlink).
      #    • GStreamer 1.24 + FFmpeg 6 are bundled in lib/gst/ (Step 2).
      #    • Remaining runtime deps (libc6, libstdc++6, libpthread) are
      #      present on every Debian-based distro and need no declaration.
      #
      #  printf is used (not a heredoc) to avoid the YAML heredoc trap:
      #  a heredoc terminator with leading spaces is never matched by bash,
      #  which would silently write an empty or truncated file.
      #
      #  Variable names:
      #    APPLICATION_PACKAGE, APPLICATION_VERSION, MAINTAINER, INSTALL_SIZE,
      #    APPLICATION_DESCRIPTION — these are the exact tokens jpackage 21
      #    substitutes.  INSTALL_SIZE (not INSTALLED_SIZE) is the correct name.
      #  Architecture is hardcoded to amd64 because this job always runs on
      #  the ubuntu-24.04 (x86_64) runner.
      - name: Override deb control template (suppress auto-generated deps)
        shell: bash
        run: |
          printf '%s\n' \
            'Package: APPLICATION_PACKAGE' \
            'Version: APPLICATION_VERSION' \
            'Section: misc' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: MAINTAINER' \
            'Installed-Size: INSTALL_SIZE' \
            'Description: APPLICATION_DESCRIPTION' \
            > src/packaging/linux/control

      # ── STEP 4: Create .deb from the patched app-image ────────────────────
      - name: Create .deb installer
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          jpackage \
            --type deb \
            --app-image target/DuckDash \
            --name DuckDash \
            --app-version "$APP_VERSION" \
            --dest target \
            --resource-dir src/packaging/linux \
            --description "2D side-scrolling runner game — help the Duck reach class on time" \
            --vendor "Duck Dash Team"

      # ── STEP 5: Build AppImage from the same patched app-image ─────────────
      - name: Download appimagetool
        run: |
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          APPDIR="DuckDash.AppDir"

          mkdir -p "$APPDIR"
          cp -r target/DuckDash/bin "$APPDIR/"
          cp -r target/DuckDash/lib "$APPDIR/"

          # AppRun was rewritten by the Python step above
          cp src/packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp src/packaging/appimage/DuckDash.desktop "$APPDIR/"
          cp src/main/resources/images/logo/team_logo2.png "$APPDIR/DuckDash.png"

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            "$APPDIR" \
            "target/DuckDash-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-deb
          path: target/*.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-linux-appimage
          path: target/*.AppImage

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS — .exe installer
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods;target/deps;$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Create .exe installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          jpackage \
            --type exe \
            --name DuckDash \
            --app-version "${GITHUB_REF_NAME#v}" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --resource-dir src/packaging/windows \
            --icon src/packaging/windows/DuckDash.ico \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-windows
          path: target/*.exe

  # ═══════════════════════════════════════════════════════════════
  #  macOS ARM64 — .dmg (Apple Silicon M1/M2/M3)
  # ═══════════════════════════════════════════════════════════════
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build runtime image (jlink)
        shell: bash
        run: |
          JAR_FILE=$(ls target/duckrun-*.jar | head -n 1)
          jlink \
            --module-path "$JAVA_HOME/jmods:target/deps:$JAR_FILE" \
            --add-modules edu.bauet.java.cse.duckrun \
            --output target/runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Prepare application directory
        shell: bash
        run: |
          mkdir -p target/app
          cp target/duckrun-*.jar target/app/
          cp target/deps/*.jar    target/app/

      - name: Generate .icns icon from project logo
        shell: bash
        run: |
          SOURCE="src/main/resources/images/logo/team_logo2.png"
          mkdir -p DuckDash.iconset src/packaging/macos
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size "$SOURCE" \
              --out "DuckDash.iconset/icon_${size}x${size}.png" 2>/dev/null || true
          done
          iconutil -c icns DuckDash.iconset \
            -o src/packaging/macos/DuckDash.icns 2>/dev/null || true

      - name: Create .dmg installer
        shell: bash
        run: |
          MAIN_JAR=$(ls target/app/duckrun-*.jar | xargs -n 1 basename)
          ICON_ARG=""
          [ -f src/packaging/macos/DuckDash.icns ] && \
            ICON_ARG="--icon src/packaging/macos/DuckDash.icns"
          jpackage \
            --type dmg \
            --name DuckDash \
            --app-version "${GITHUB_REF_NAME#v}" \
            --input target/app \
            --main-jar "$MAIN_JAR" \
            --main-class edu.bauet.java.cse.duckrun.MainApp \
            --runtime-image target/runtime \
            --dest target \
            --resource-dir src/packaging/macos \
            --mac-package-identifier edu.bauet.java.cse.duckrun \
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" \
            $ICON_ARG

      - name: Rename DMG with architecture label
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(ls target/DuckDash-*.dmg 2>/dev/null | head -1)
          [ -n "$DMG" ] && mv "$DMG" "target/DuckDash-${VERSION}-macos-arm64.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckDash-macos-arm64
          path: target/DuckDash-*-macos-arm64.dmg

  # ═══════════════════════════════════════════════════════════════
  #  RELEASE — attach all artifacts to the GitHub Release
  # ═══════════════════════════════════════════════════════════════
  release:
    needs: [build-linux, build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DuckDash-linux-deb/*.deb
            DuckDash-linux-appimage/*.AppImage
            DuckDash-windows/*.exe
            DuckDash-macos-arm64/*.dmg
          generate_release_notes: true
